owner: windgarde
repo: snapglyph-status

sites:
  - name: SnapGlyph App
    url: https://app.snapglyph.com
  - name: API
    url: https://app.snapglyph.com/api/health
    expectedStatusCodes:
      - 200
    # /api/health returns 200 + {"status":"healthy"} only when the DB is reachable.
    __dangerous__body-down-if-text-missing: healthy
  - name: Short Link Redirects
    url: https://glph.link/IZHM3XSG
    # SLA-critical redirect hop. Permanent canary link -> https://snapglyph.com
    # A 3xx that resolves to the destination counts as up.

status-website:
  cname: status.snapglyph.com
  name: Status
  introTitle: "SnapGlyph Status"
  introMessage: Live and historical availability for SnapGlyph services.
  logoUrl: https://status.snapglyph.com/logo.svg
  favicon: https://status.snapglyph.com/favicon.svg
  # Response-time chart colours -> SnapGlyph orange (default was teal #1abc9c / #89e0cf)
  graphBorderColor: "#f97316"
  graphBackgroundColor: "#fcd9b6"
  navbar:
    - title: Status
      href: /
    - title: SLA
      href: https://snapglyph.com/sla
    - title: Website
      href: https://snapglyph.com
  # Off-white base + orange accent. Operational green / down red / degraded amber left intact.
  css: |
    :root {
      --body-background-color: #fafaf9 !important;
      --body-text-color: #1c1917 !important;
      --card-background-color: #ffffff !important;
      --nav-background-color: #ffffff !important;
      --nav-border-bottom-color: #ece7e3 !important;
      --card-border-color: #ece7e3 !important;
      --nav-current-border-bottom-color: #f97316 !important;
      --error-button-border-color: #ea580c !important;
      --error-button-background-color: #f97316 !important;
      --submit-button-border-color: #ea580c !important;
      --submit-button-background-color: #f97316 !important;
    }
    /* hardcoded teal/blue fallbacks in global.css */
    .submit-button { background: #f97316 !important; border-color: #ea580c !important; }
    a.error-button { background: #f97316 !important; border-color: #ea580c !important; }
    a { text-decoration-color: #f97316; }
    /* hide footer ("open source, powered by Upptime") incl. the public-repo link */
    footer { display: none !important; }
  # Force the browser-tab favicon to SnapGlyph's (the SVG <link> is otherwise hardcoded upstream).
  js: |
    (function () {
      document.querySelectorAll("link[rel~='icon']").forEach(function (l) { l.parentNode.removeChild(l); });
      var i = document.createElement("link");
      i.rel = "icon";
      i.type = "image/svg+xml";
      i.href = "/favicon.svg";
      document.head.appendChild(i);
    })();
